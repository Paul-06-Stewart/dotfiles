# ─── Prefix: Ctrl+a instead of Ctrl+b ───
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support (resize panes, select windows, scroll)
set -g mouse on
bind -T copy-mode-vi WheelUpPane send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Transparent status bar. Colours use the 16-slot ANSI palette (colourN) instead
# of hex, so the whole bar follows Ghostty's light/dark theme (Catppuccin
# Mocha ↔ Latte) automatically. colour5 = accent (Pink in Mocha), colour6 = teal.
set -g status-style 'bg=default fg=colour8'
set -g status-position bottom

# Left - session name (teal)
set -g status-left '#[fg=colour6,bold]#S #[fg=colour8]│ '
set -g status-left-length 30

# Right - time
set -g status-right '#[fg=colour8]│ #[fg=colour7]%H:%M '

# Window tabs (active = accent block)
set -g window-status-format '#[fg=colour8]#I:#W'
set -g window-status-current-format '#[fg=colour0,bg=colour5,bold] #I:#W '
set -g window-status-separator '  '

# Pane borders (active = accent)
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour5,bold'
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}: #{?pane_title,#{pane_title},#{pane_current_command}} '

# Copy-mode selection, messages, and clock share the accent
set -g message-style 'bg=colour5,fg=colour0'
set -g mode-style 'bg=colour5,fg=colour0'
set -g clock-mode-colour colour5

# TUI-friendly settings for Claude Code and similar tools
set -ga terminal-overrides ",*:smcup@:rmcup@"   # disable alternate screen inside tmux to fix floating input bars
set -g default-terminal "tmux-256color"         # use the new terminfo entry
set -g focus-events on                          # better focus handling for TUIs
set -g aggressive-resize off                    # avoid resize flicker

set -g history-limit 200000                     # generous scrollback
# ─── Intuitive splits (in same directory) ───
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# ─── New windows open in same directory ───
bind c new-window -c "#{pane_current_path}"

# ─── Navigate panes with Alt+hjkl (no prefix needed) ───
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ─── Navigate panes with prefix + hjkl (vim-style, repeatable) ───
bind -r h select-pane -L
bind -r l select-pane -R
bind -r k select-pane -U
bind -r j select-pane -D

# ─── Resize panes with Shift+Alt+arrow (no prefix needed) ───
bind -n M-S-Left  resize-pane -L 2
bind -n M-S-Right resize-pane -R 2
bind -n M-S-Up    resize-pane -U 2
bind -n M-S-Down  resize-pane -D 2

# ─── Window/pane numbering starts at 1 ───
set -g base-index 1
setw -g pane-base-index 1

# ─── Renumber windows when one is closed ───
set -g renumber-windows on

# ─── Don't auto-rename windows ───
set -g allow-rename off

# ─── Reduce escape delay (important for vim/neovim) ───
set -sg escape-time 10
set -g mode-keys vi
setw -g mode-keys vi


# ─── Reload config with prefix+r ───
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ─── TPM - Tmux Plugin Manager ─── 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TPM before final local overrides.
run '~/.tmux/plugins/tpm/tpm'

# tmux-sensible enables this; keep it off to avoid TUI resize flicker.
setw -g aggressive-resize off
