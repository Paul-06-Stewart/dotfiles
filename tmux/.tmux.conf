# ─── Prefix: Ctrl+a instead of Ctrl+b ───
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support (resize panes, select windows, scroll)
set -g mouse on
bind -T copy-mode-vi WheelUpPane send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down
# Transparent status bar
set -g status-style 'bg=default fg=#888888'
set -g status-position bottom

# Left - session name
set -g status-left '#[fg=#74c7ec]#S #[fg=#444444]│ '
set -g status-left-length 30

# Right - time
set -g status-right '#[fg=#444444]│ #[fg=#888888]%H:%M'

# Window tabs
set -g window-status-format '#[fg=#555555]#I:#W'
set -g window-status-current-format '#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W '
set -g window-status-separator '  '

# Pane borders
set -g pane-border-style 'fg=#333333'
set -g pane-active-border-style 'fg=#cba6f7,bold'
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}: #{?pane_title,#{pane_title},#{pane_current_command}} '

# TUI-friendly settings for Claude Code and similar tools
set -ga terminal-overrides ",*:smcup@:rmcup@"   # disable alternate screen inside tmux to fix floating input bars
set -g default-terminal "tmux-256color"         # use the new terminfo entry
set -g focus-events on                          # better focus handling for TUIs
set -g aggressive-resize off                    # avoid resize flicker
set -g default-terminal "xterm-256color"
set -g aggressive-resize on

set -g history-limit 50000                      # generous scrollback
# ─── Intuitive splits (in same directory) ───
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ─── New windows open in same directory ───
bind c new-window -c "#{pane_current_path}"

# ─── Navigate panes with Alt+hjkl (no prefix needed) ───
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ─── Resize panes with Shift+Alt+arrow (no prefix needed) ───
bind -n M-S-Left  resize-pane -L 2
bind -n M-S-Right resize-pane -R 2
bind -n M-S-Up    resize-pane -U 2
bind -n M-S-Down  resize-pane -D 2

# ─── Window/pane numbering starts at 1 ───
set -g base-index 1
setw -g pane-base-index 1

# ─── Renumber windows when one is closed ───
set -g renumber-windows on

# ─── Don't auto-rename windows ───
set -g allow-rename off

# ─── Reduce escape delay (important for vim/neovim) ───
set -sg escape-time 10
set -g mode-keys vi

# ─── Reload config with prefix+r ───
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ─── TPM - Tmux Plugin Manager ─── 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
